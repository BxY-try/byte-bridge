<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#312e81" stroke-width="4" opacity="0.6" />

  <!-- Bridge Arch / Wifi wave graphic -->
  <path d="M120 340 C160 220, 352 220, 392 340" fill="none" stroke="url(#neonGrad)" stroke-width="28" stroke-linecap="round" filter="url(#glow)" />
  
  <path d="M170 340 C195 260, 317 260, 342 340" fill="none" stroke="#a855f7" stroke-width="20" stroke-linecap="round" />

  <!-- Keypad dots/nodes -->
  <circle cx="256" cy="170" r="28" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="180" cy="200" r="18" fill="#818cf8" />
  <circle cx="332" cy="200" r="18" fill="#c084fc" />

  <!-- Bottom bridge base line -->
  <line x1="100" y1="380" x2="412" y2="380" stroke="url(#neonGrad)" stroke-width="12" stroke-linecap="round" />
</svg>
