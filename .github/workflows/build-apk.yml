name: Build ByteBridge Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Fresh Android Scaffolding
        run: |
          cd flutter_app
          flutter create . --platforms=android --org com.bytebridge
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r') as f: content = f.read()
          perms = '''    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />\n    <uses-permission android:name=\"android.permission.ACCESS_WIFI_STATE\" />\n    <uses-permission android:name=\"android.permission.VIBRATE\" />\n    <uses-permission android:name=\"android.permission.CAMERA\" />\n    <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />\n'''
          content = content.replace('<application', perms + '    <application android:usesCleartextTraffic=\"true\"')
          with open(p, 'w') as f: f.write(content)
          print('Patched AndroidManifest.xml successfully')

          with open('android/app/proguard-rules.pro', 'w') as f:
              f.write('-keep class com.google.mlkit.** { *; }\n-dontwarn com.google.mlkit.**\n-dontwarn **\n')
          print('Created proguard-rules.pro successfully')

          import os
          for path in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              if os.path.exists(path):
                  with open(path, 'r') as f: c = f.read()
                  c = c.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("debug")\n            isMinifyEnabled = false\n            isShrinkResources = false')
                  c = c.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.debug\n            minifyEnabled false\n            shrinkResources false')
                  with open(path, 'w') as f: f.write(c)
                  print(f'Patched {path} successfully')
          "

      - name: Install dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build Android APK
        run: |
          cd flutter_app
          flutter build apk --release --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ByteBridge-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: ByteBridge ${{ github.ref_name }}
          generate_release_notes: true
          files: flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
