name: Build ByteBridge Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Fresh Android Scaffolding
        run: |
          cd flutter_app
          flutter create . --platforms=android --org com.bytebridge
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r') as f: content = f.read()
          perms = '''    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />\n    <uses-permission android:name=\"android.permission.ACCESS_WIFI_STATE\" />\n    <uses-permission android:name=\"android.permission.VIBRATE\" />\n'''
          content = content.replace('<application', perms + '    <application android:usesCleartextTraffic=\"true\"')
          with open(p, 'w') as f: f.write(content)
          print('Patched AndroidManifest.xml successfully')
          "

      - name: Install dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build Android APK
        run: |
          cd flutter_app
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ByteBridge-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.3' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'ByteBridge v1.0.3' }}
          body: |
            ### Pembaruan ByteBridge v1.0.3
            - Palet warna presisi sesuai kode RGBA pengguna:
              - Housing frame: #8D8D8D
              - Tombol operasi hitung: #C4DBE1
              - Tombol enter: #72B67D
              - Tombol delete: #D46C6D
              - Tombol angka: #DCEBF0
            - Proporsi tombol angka & operator dibuat kotak/kompak (bukan persegi panjang tinggi)
            - Posisi numpad digeser ke bawah mendekati footer agar ergonomis dijangkau satu tangan
            - Penyelarasan palet warna global pada aplikasi
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
